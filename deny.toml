# cargo-deny configuration for sol-trade-sdk
# Generated by Dependency & Supply Chain Audit, 2026-07-28
#
# Usage: cargo deny check (from workspace root)
# Install: cargo install cargo-deny
#
# This config is a DRAFT. It uses skip-tree for known Solana ecosystem
# multi-version crates (expected due to the large version range of the
# Solana SDK). Adjust thresholds and skip directives as needed.

[graph]
# Use the default graph target

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db.git"]
# If you update cargo-deny to a version that supports CVSS 4.0, this will work.
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"
# Ignore specific advisories by ID
# ignore = ["RUSTSEC-2026-XXXX"]

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MIT-0",
    "Apache-2.0 WITH LLVM-exception",
    "CDLA-Permissive-2.0",
    "LGPL-2.1-or-later",
]
deny = [
    # Add GPL, AGPL, or other copyleft licenses here if they must be forbidden
    # "GPL-3.0",
]
# For crates with multiple licenses listed (e.g. "MIT OR Apache-2.0"), 
# cargo-deny will match if any of the listed licenses are in the allow list.
confidence-threshold = 0.8
# Override licenses for specific crates
# exceptions = [
#     { name = "solana-config-interface", version = "2.0.0", assert = "Apache-2.0" },
# ]

[bans]
# When true, crates with duplicate versions are denied
multiple-versions = "deny"
# When true, crates with the same name but different sources are denied
same-name = "deny"
# Skip duplicate-version checking for the entire Solana and SPL ecosystem,
# which has many expected multi-version occurrences due to:
#   - The SDK using solana-sdk v3.0.x while transitive deps use v2.x
#   - Yellowstone gRPC using newer tonic/prost
#   - Solana's own fragmented crate versioning
skip-tree = [
    # Solana SDK v2.x ecosystem (transitive from older Solana crate versions)
    { name = "solana-program", version = "2.3.0" },
    { name = "solana-account-info", version = "2.3.0" },
    { name = "solana-address", version = "1.1.0" },
    { name = "solana-clock", version = "2.2.3" },
    { name = "solana-cpi", version = "2.2.1" },
    { name = "solana-define-syscall", version-gte = "2.3.0" },
    { name = "solana-hash", version-gte = "2.3.0" },
    { name = "solana-instruction", version = "2.3.3" },
    { name = "solana-message", version = "2.4.0" },
    { name = "solana-pubkey", version = "2.4.0" },
    { name = "solana-signature", version = "2.3.0" },
    { name = "solana-sysvar", version = "2.3.0" },
    { name = "solana-vote-interface", version = "2.2.6" },
    { name = "solana-account", version = "2.2.1" },
    { name = "solana-stake-interface", version = "1.2.1" },
    { name = "solana-nonce", version = "2.2.1" },
    # solana-hash v4.x and solana-pubkey v4.x come from yellowstone-grpc-proto
    { name = "solana-hash", version = "4.6.0" },
    { name = "solana-pubkey", version = "4.3.0" },
    # solana-zk-sdk v2.x vs v4.x (both transitive)
    { name = "solana-zk-sdk", version = "2.3.13" },
    # solana-system-interface multiple versions from old spl deps
    { name = "solana-system-interface", version-gte = "1.0.0" },
    # solana-loader-v3-interface v5/6 from spl deps
    { name = "solana-loader-v3-interface", version-gte = "5.0.0" },
    # SPL duplicate versions
    { name = "spl-token", version-gte = "7.0.0" },
    { name = "spl-token-2022", version-gte = "6.0.0" },
    { name = "spl-program-error", version-gte = "0.6.0" },
    { name = "spl-program-error-derive", version-gte = "0.4.1" },
    { name = "spl-tlv-account-resolution", version-gte = "0.9.0" },
    { name = "spl-type-length-value", version-gte = "0.7.0" },
    { name = "spl-transfer-hook-interface", version-gte = "0.9.0" },
    { name = "spl-token-metadata-interface", version-gte = "0.6.0" },
    { name = "spl-token-confidential-transfer-ciphertext-arithmetic", version-gte = "0.2.1" },
    { name = "spl-token-confidential-transfer-proof-extraction", version-gte = "0.2.1" },
    { name = "spl-token-confidential-transfer-proof-generation", version-gte = "0.2.0" },
    { name = "spl-elgamal-registry", version-gte = "0.1.1" },
    { name = "spl-pod", version-gte = "0.5.1" },
    { name = "spl-discriminator", version-gte = "0.4.1" },
    { name = "spl-associated-token-account", version-gte = "6.0.0" },
    # Non-Solana ecosystem multi-version crates (typically unavoidable)
    { name = "tonic", version-gte = "0.12.0" },
    { name = "prost", version-gte = "0.13.0" },
    { name = "prost-derive", version-gte = "0.13.0" },
    { name = "thiserror", version = "1.0.69" },
    { name = "thiserror-impl", version = "1.0.69" },
    { name = "tokio-util", version-gte = "0.7.0" },
    { name = "tower", version = "0.4.13" },
    { name = "hyper-util", version-gte = "0.1.0" },
    { name = "hyper-rustls", version-gte = "0.27.0" },
    { name = "webpki-roots", version-gte = "0.26.0" },
    { name = "syn", version = "1.0.109" },
    { name = "synstructure", version = "0.12.6" },
    { name = "wincode", version = "0.1.2" },
    { name = "wincode-derive", version = "0.1.1" },
    { name = "rustls-platform-verifier", version = "0.6.2" },
    # Transitive old versions from Solana's own deps
    { name = "base64", version = "0.12.3" },
    { name = "base64", version = "0.13.1" },
    { name = "pem", version = "1.1.1" },
    { name = "num-bigint", version = "0.2.6" },
    { name = "num-complex", version = "0.2.4" },
    { name = "num-rational", version = "0.2.4" },
    { name = "num", version = "0.2.1" },
    { name = "rand", version = "0.7.3" },
    { name = "rand", version = "0.8.7" },
    { name = "rand_core", version-gte = "0.5.0" },
    { name = "sha2", version = "0.9.9" },
    { name = "siphasher", version = "0.3.11" },
    { name = "socket2", version = "0.5.10" },
    { name = "windows-sys", version = "0.45.0" },
    { name = "windows-targets", version = "0.42.2" },
    { name = "windows_aarch64_gnullvm", version = "0.42.2" },
    { name = "windows_aarch64_msvc", version = "0.42.2" },
    { name = "windows_i686_gnu", version = "0.42.2" },
    { name = "windows_i686_msvc", version = "0.42.2" },
    { name = "windows_x86_64_gnu", version = "0.42.2" },
    { name = "windows_x86_64_gnullvm", version = "0.42.2" },
    { name = "windows_x86_64_msvc", version = "0.42.2" },
    # Arkworks/zk crypto transitive deps (solana-poseidon -> ark-bn254)
    { name = "ark-bn254", version-gte = "0.4.0" },
    { name = "ark-ec", version-gte = "0.4.0" },
    { name = "ark-ff", version-gte = "0.4.0" },
    { name = "ark-ff-asm", version-gte = "0.4.0" },
    { name = "ark-ff-macros", version-gte = "0.4.0" },
    { name = "ark-poly", version-gte = "0.4.0" },
    { name = "ark-serialize", version-gte = "0.4.0" },
    { name = "ark-serialize-derive", version-gte = "0.4.0" },
    { name = "ark-std", version-gte = "0.4.0" },
    { name = "light-poseidon", version-gte = "0.2.0" },
    # dashmap old version from Solana
    { name = "dashmap", version = "5.5.3" },
    # Borsh older versions
    { name = "borsh-derive", version = "0.10.4" },
    { name = "borsh", version = "0.10.4" },
    # getrandom v0.1/0.2 from old rand deps
    { name = "getrandom", version-gte = "0.1.0" },
    # solana-address v2.7 from solana-sdk
    { name = "solana-address", version = "2.7.0" },
    # solana-instructions-sysvar v2 from spl deps
    { name = "solana-instructions-sysvar", version = "2.2.2" },
    # solana-secp256k1-recover v2 from old solana deps
    { name = "solana-secp256k1-recover", version = "2.2.1" },
]

# Skip specific crate version pairs (use when skip-tree is too broad)
skip = [
    # Example: { name = "some-crate", version = "1.2.3" }
]

[sources]
# Allow only crates.io and known git sources
allow-unknown = false
# Explicitly allow registry and known git
allow-git = [
    "https://github.com/0xfnzero/sol-parser-sdk",
    "https://github.com/0xfnzero/solana-streamer",
]
# Deny all other git/registry sources
deny = []
# Unknown registries
unknown-registry = "deny"
# Unknown git sources
unknown-git = "deny"

[sources.allow-org]
# Only allow GitHub orgs that are known
github = ["0xfnzero", "anza-xyz", "solana-labs", "solana-foundation"]

