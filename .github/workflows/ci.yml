# =============================================================================
# CI/CD Pipeline for sol-trade-sdk
# =============================================================================
#
# DESIGN OVERVIEW
# ---------------
# This CI workflow provides a comprehensive gate for PR-based development.
# It enforces code quality, security, and correctness before any merge.
# The workflow is designed to run on every push to any branch and on all PRs
# targeting 'main' (or the active development branch).
#
# REQUIRED INFRASTRUCTURE
# ------------------------
# 1. rust-toolchain.toml (currently missing — must be created to pin version)
# 2. deny.toml (exists — use as-is)
# 3. cargo-deny: installed via taiki-e/install-action
# 4. cargo-audit: installed via taiki-e/install-action
# 5. Secrets: SLACK_WEBHOOK (for scheduled job alerts)
# =============================================================================

name: CI

"on":
  push:
    branches: ["main", "develop", "release/*"]
  pull_request:
    branches: ["main", "develop"]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  # =========================================================================
  # JOB: fmt
  # Uses nightly rustfmt for latest formatting features
  # =========================================================================
  fmt:
    name: Formatting (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # =========================================================================
  # JOB: check (fast compile-time validation)
  # =========================================================================
  check:
    name: Check (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace --all-targets --all-features

  # =========================================================================
  # JOB: clippy (linting with deny-warnings)
  # =========================================================================
  clippy:
    name: Linting (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy check
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # =========================================================================
  # JOB: test (debug mode)
  # =========================================================================
  test:
    name: Tests (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (debug)
        run: cargo test --workspace

  # =========================================================================
  # JOB: test-release (release mode)
  # =========================================================================
  test-release:
    name: Tests (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (release)
        run: cargo test --release --workspace

  # =========================================================================
  # JOB: audit (security vulnerabilities)
  # =========================================================================
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory DB fetch failures don't block CI
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  # =========================================================================
  # JOB: deny (license, bans, sources)
  # =========================================================================
  deny:
    name: License/Bans/Sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check

