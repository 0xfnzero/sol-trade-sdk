# CI/CD pipeline for sol-trade-sdk
#
# Runs on every PR and push to main. Consists of three jobs:
#   1. check  — cargo check + clippy on all feature combinations
#   2. test   — cargo test on the full feature set
#   3. bench  — cargo bench (informational, non-blocking)

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:

  # ── Lint & Format ──────────────────────────────────────────────────────────

  lint:
    name: Lint (clippy + rustfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo clippy (default)
        run: cargo clippy --all-targets --features dev-insecure-tls -- -D warnings

      - name: cargo clippy (no features — SWQoS gates expected)
        run: |
          # SWQoS compile_error! gates are expected without dev-insecure-tls
          cargo clippy --all-targets 2>&1 | head -20 || true
          echo "(non-zero exit expected — SWQoS TLS gates active)"

      - name: cargo fmt --check
        run: cargo fmt --all --check

  # ── Build ──────────────────────────────────────────────────────────────────

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo build (lib + bin)
        run: cargo build --all-targets --features dev-insecure-tls --release

      - name: Verify binary
        run: |
          file target/release/solbot
          ./target/release/solbot --help

      - name: Check unexpected warnings
        run: |
          # Ensure no warnings on clean build (except expected ones)
          cargo build --features dev-insecure-tls --release -q 2>&1 | grep -v "unused_variables" | grep -v "warning:" && echo "UNEXPECTED WARNINGS FOUND" && exit 1 || echo "No unexpected warnings"

  # ── Test ───────────────────────────────────────────────────────────────────

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo test (full feature set)
        run: cargo test --features dev-insecure-tls --release

      - name: Test summary
        run: |
          echo "All tests passed."
          cargo test --features dev-insecure-tls --release -q 2>&1 | grep "test result" | tail -3

  # ── Benchmarks (informational) ─────────────────────────────────────────────

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # informational — never blocks PR merge
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly (for divan benchmarks)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo bench
        run: cargo bench --features dev-insecure-tls -- --quiet 2>&1 || echo "Benchmark run completed (non-zero exit is informational)"

      - name: Benchmark summary
        run: |
          echo "Benchmarks completed. See CI logs for detailed timing."