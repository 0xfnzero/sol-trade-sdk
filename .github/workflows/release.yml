name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Gate: require all CI checks to pass before creating release
  ci-pass:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: [ci-pass]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.tag.outputs.VERSION }}
          body: |
            ## sol-trade-sdk ${{ steps.tag.outputs.VERSION }}

            Rust SDK to interact with the dex trade Solana program (Pump.fun, Raydium, etc.).

            **Pre-flight:** Build, fmt, clippy, tests, audit, and dependency checks pass.
            **Pinned toolchain:** 1.82.0 (see rust-toolchain.toml)
            **Supply chain:** `cargo-deny` enforced (see deny.toml)
            **TLS:** Production builds require `dev-insecure-tls` feature for QUIC providers.

            - **Cargo**: `sol-trade-sdk = { git = "https://github.com/${{ github.repository }}", tag = "v${{ steps.tag.outputs.VERSION }}" }`
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}