name: Native Integration Suite (Linux)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  native-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      PATH: /home/runner/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4

      - name: Install and verify Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.1
          components: clippy

      - name: Update rustup and verify toolchain
        run: |
          # Explicit version pin to bypass stale rustup release channel
          rustup install 1.85.1 --profile minimal 2>&1 || true
          rustup default 1.85.1 2>&1 || true
          echo "/home/runner/.cargo/bin" >> "$GITHUB_PATH"
          echo "=== Rust toolchain ==="
          rustc --version
          cargo --version
          which cargo

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check --all-targets
        run: ~/.cargo/bin/cargo check --features dev-insecure-tls --all-targets 2>&1
        continue-on-error: false

      - name: cargo test --lib (unit tests)
        run: ~/.cargo/bin/cargo test --features dev-insecure-tls --lib 2>&1
        continue-on-error: false

      - name: cargo test --test runtime_behaviour (integration)
        run: ~/.cargo/bin/cargo test --features dev-insecure-tls --test runtime_behaviour 2>&1
        continue-on-error: false

      - name: cargo test (all tests + integration)
        run: ~/.cargo/bin/cargo test --features dev-insecure-tls 2>&1
        continue-on-error: false

      - name: cargo clippy --all-targets
        run: ~/.cargo/bin/cargo clippy --features dev-insecure-tls --all-targets 2>&1
        continue-on-error: false

      - name: Print Rust version
        run: |
          rustc --version
          ~/.cargo/bin/cargo --version
          uname -a