name: Native Integration Suite (Linux)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  native-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fresh Rust via rustup.rs
        run: |
          # The ubuntu-24.04 runner ships an old rustup that resolves
          # stable=1.82.0 (too old for Cargo.lock deps).
          # Patch the stale settings, then install rustup with 1.89.0.
          if [ -f /home/runner/.rustup/settings.toml ]; then
            sed -i 's/^default_toolchain = .*/default_toolchain = "1.89.0"/' \
              /home/runner/.rustup/settings.toml
          fi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.89.0 2>&1
          /home/runner/.cargo/bin/rustup component add clippy 2>&1
          echo "=== Rust toolchain ==="
          /home/runner/.cargo/bin/rustc --version
          /home/runner/.cargo/bin/cargo --version
          /home/runner/.cargo/bin/rustup show

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check --all-targets
        run: /home/runner/.cargo/bin/cargo check --features dev-insecure-tls --all-targets 2>&1
        continue-on-error: false

      - name: cargo test --lib (unit tests)
        run: /home/runner/.cargo/bin/cargo test --features dev-insecure-tls --lib 2>&1
        continue-on-error: false

      - name: cargo test --test runtime_behaviour (integration)
        run: /home/runner/.cargo/bin/cargo test --features dev-insecure-tls --test runtime_behaviour 2>&1
        continue-on-error: false

      - name: cargo test (all tests + integration)
        run: /home/runner/.cargo/bin/cargo test --features dev-insecure-tls 2>&1
        continue-on-error: false

      - name: cargo clippy --all-targets
        run: /home/runner/.cargo/bin/cargo clippy --features dev-insecure-tls --all-targets 2>&1
        continue-on-error: false

      - name: Print Rust version
        run: |
          /home/runner/.cargo/bin/rustc --version
          /home/runner/.cargo/bin/cargo --version
          uname -a