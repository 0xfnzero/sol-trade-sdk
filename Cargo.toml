[package]
name = "sol-trade-sdk"
version = "5.0.5"
edition = "2021"
authors = [
    "William <byteblock6@gmail.com>",
    "sgxiang <sgxiang@gmail.com>",
    "wei <1415121722@qq.com>",
]
repository = "https://github.com/0xfnzero/sol-trade-sdk"
description = "A high-performance Rust SDK for Solana DEX trading."
license = "MIT"
keywords = ["solana", "memecoins", "pumpfun", "pumpswap", "raydium"]
readme = "README.md"


[workspace]
members = [
    "onchain/hookie-precheck",
    "examples/trading_client",
    "examples/shared_infrastructure",
    "examples/middleware_system",
    "examples/pumpswap_trading",
    "examples/pumpfun_copy_trading",
    "examples/pumpfun_sniper_trading",
    "examples/bonk_sniper_trading",
    "examples/bonk_copy_trading",
    "examples/raydium_cpmm_trading",
    "examples/raydium_amm_v4_trading",
    "examples/address_lookup",
    "examples/nonce_cache",
    "examples/pumpswap_direct_trading",
    "examples/wsol_wrapper",
    "examples/seed_trading",
    "examples/cli_trading",
    "examples/gas_fee_strategy",
    "examples/meteora_damm_v2_direct_trading",
    "examples/simple_trading",
    "examples/stonkfun_via_sol_simulate",
]
[workspace.dependencies]
sol-parser-sdk = { version = "=0.7.6", path = "../sol-parser-sdk" }
solana-streamer-sdk = { version = "=3.0.5", path = "../solana-streamer" }
solana-sdk = "4.0.1"
solana-commitment-config = { version = "3.1.1", features = ["serde"] }
solana-system-interface = { version = "3.0.0", features = ["bincode"] }

[lib]
crate-type = ["rlib"]

[features]
default = []
perf-trace = []  # 性能追踪特性，生产环境应禁用以获得最佳性能

[dependencies]
solana-sdk = { workspace = true }
solana-client = "4.2.2"
solana-program = "4.0.0"
solana-rpc-client-api = "4.2.2"
solana-account-decoder = "4.2.2"
solana-hash = "4.4.0"
solana-tls-utils = "4.2.2"

solana-message = "4.4.0"
solana-compute-budget-interface = "3.0.0"
solana-commitment-config = { workspace = true }
solana-transaction = { version = "4.1.6", features = ["serde", "wincode"] }
solana-transaction-status-client-types = "4.2.2"
solana-system-interface = { workspace = true }
spl-token-2022-interface = "3.1.1"

borsh = { version = "1.5.3", features = ["derive"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.134"
futures = "0.3.31"
base64 = "0.22.1"
bs58 = "0.5.1"
bytes = "1"
rand = "0.9.0"
bincode = "1.3.3"
wincode = "=0.5.5"
anyhow = "1.0.90"
reqwest = { version = "0.12.12", default-features = false, features = ["http2", "json", "multipart", "rustls-tls-native-roots"] }
http = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
tokio = { version = "1.42.0" , features = ["full", "rt-multi-thread"]}
tonic = { version = "0.12", features = ["transport"] }
rustls = { version = "0.23.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8.1"
core_affinity = "0.8"
chrono = "0.4.39"
tracing = "0.1.41"
async-trait = "0.1.86"
once_cell = "1.20.3"
prost = "0.13"
fnv = "1.0.7"
dashmap = "6.1.0"
smallvec = "1.15.1"
parking_lot = "0.12"
arc-swap = "1.7"
sha2 = "0.10"
# 须含 runtime-tokio，否则 quinn::Endpoint::client 报 no async runtime found，QUIC（Speedlanding/Soyas）无法初始化
quinn = { version = "0.11", default-features = false, features = ["rustls", "runtime-tokio"] }
lunar-lander-quic-client = "0.4"
rcgen = "0.13"
uuid = "1.11"

# Performance optimization dependencies
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
memmap2 = "0.9"
num_cpus = "1.16"
libc = "0.2"

[dev-dependencies]
sol-parser-sdk = { workspace = true }

# Runtime-first release profile for latency-sensitive trading binaries.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug = false
debug-assertions = false
rpath = false
strip = true
incremental = false

[profile.dev]
opt-level = 1              # 开发时适度优化
overflow-checks = true     # 开发时启用溢出检查

# 🚀 构建依赖
# 注意：proto 代码已预生成在 src/swqos/pb/serverpb.rs
# 开发者如需重新生成代码，请运行 gen_proto 目录下的工具

# 🚀 性能关键依赖的特殊优化
[profile.release.package.solana-sdk]
opt-level = 3

[profile.release.package.bincode]
opt-level = 3

[profile.release.package.wincode]
opt-level = 3
