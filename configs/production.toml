# sol-trade-sdk Production Configuration
# Phase 13: Production Deployment
#
# Copy this to /etc/solbot/config.toml and adjust:
#   1. Set wallet.execution_keypair_path to your production keypair
#   2. Set submission.jito.auth_token to your Jito auth token
#   3. Adjust risk limits to match your strategy requirements
#   4. Set RPC endpoints to premium providers (Helius, QuickNode, etc.)
#
# Run with: solbot --config /etc/solbot/config.toml --keypair /path/to/keypair.json

# ── 1. Network ─────────────────────────────────────────────────────────────────
[network]
rpc_url = "https://api.mainnet-beta.solana.com"
rpc_fallback_url = "https://solana-api.projectserum.com"
ws_url = "wss://api.mainnet-beta.solana.com"
connection_timeout_secs = 10
request_timeout_secs = 30
rate_limit_rps = 100

# ── 2. RPC ─────────────────────────────────────────────────────────────────────
[rpc]
primary = "https://api.mainnet-beta.solana.com"
fallback = "https://solana-api.projectserum.com"
commitment = "processed"
rate_limit_per_second = 100
max_retries = 3
retry_backoff_ms = [100, 500, 2000]

# ── 3. ShredStream ─────────────────────────────────────────────────────────────
[shredstream]
enabled = true
udp_bind_addr = "0.0.0.0:8001"
receive_buffer_bytes = 67108864
busy_poll_usec = 200
slot_window = 3
fec_enabled = true
stuck_batch_timeout_ms = 50
program_ids = [
    "6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P",  # PumpFun
    "pAMMBay6oceH9fJKBRHGP5D4bD8sKbwv3Y5SQE2sTjQ",  # PumpSwap
    "675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8",  # Raydium AMM V4
    "CPMMoo8L3F4NbTegBCKVNunggL7H1ZpdTHKxQB5qKP1C",  # Raydium CPMM
    "LBUZKhRxPF3XUpBCjp4YzTKgY6bE1UEsLzD2jF5K5oM",  # Meteora
]

[shredstream.cpu_affinity]
receive_core = 0
reconstruct_core = 1
state_strategy_core = 2
execute_core = 3

# ── 4. Protocols ───────────────────────────────────────────────────────────────
[protocols]
enabled = ["pumpfun", "pumpswap", "raydium_cpmm"]
disabled = []

[protocols.pumpfun]
max_quote_age_ms = 500
min_liquidity_sol = 5.0

[protocols.pumpswap]
max_quote_age_ms = 300
min_liquidity_sol = 1.0

[protocols.raydium_amm_v4]
max_quote_age_ms = 200
min_liquidity_sol = 1.0

[protocols.raydium_cpmm]
max_quote_age_ms = 200
min_liquidity_sol = 1.0

[protocols.meteora_damm_v2]
max_quote_age_ms = 200
min_liquidity_sol = 1.0

[protocols.bonk]
max_quote_age_ms = 500
min_liquidity_sol = 0.5

# ── 5. Submission (SWQOS + Jito Bundle) ────────────────────────────────────────
[submission]
primary_provider = "rpc"
fallback_provider = "jito"
max_simultaneous_lanes = 2
require_same_signature = true

[submission.jito]
endpoint = "https://mainnet.block-engine.jito.wtf"
auth_token = "${JITO_AUTH_TOKEN}"
bundle_tip_strategy = "strategy-aware"
tip_min_lamports = 1000
tip_max_lamports = 100000

# ── 6. Wallet ──────────────────────────────────────────────────────────────────
[wallet]
execution_keypair_path = "/etc/solbot/execution-keypair.json"
payer_keypair_path = "/etc/solbot/payer-keypair.json"
min_balance_sol = 0.5
max_balance_sol = 10.0

# ── 7. Blockhash ───────────────────────────────────────────────────────────────
[blockhash]
refresh_interval_ms = 200
max_age_slots = 150
stale_threshold_ms = 500
commitment = "confirmed"
fail_on_lag = true

# ── 8. Fees ────────────────────────────────────────────────────────────────────
[fees]
compute_unit_limit = 400000
compute_unit_price = 1000
max_priority_fee_lamports = 10000
max_relay_tip_lamports = 5000
max_total_tx_cost_lamports = 20000
profit_threshold_lamports = 1000
cu_tracking_enabled = true
cu_tracking_window = 100

# ── 9. Risk ────────────────────────────────────────────────────────────────────
[risk]
max_sol_per_trade = 0.1
max_token_amount_per_trade = 500000000
max_slippage_basis_points = 100
max_quote_age_ms = 200
max_source_slot_age = 2
min_expected_output = 1
min_expected_output_as_bps = false
min_expected_net_profit_lamports = 500

[risk.global]
max_open_exposure_sol = 1.0
max_exposure_per_mint_pct = 25.0
max_exposure_per_protocol_pct = 50.0
max_tx_per_minute = 60
max_failures_per_5min = 10
per_mint_cap_sol = 0.5
max_positions_per_protocol = 3
max_daily_trades = 500
max_open_positions = 5

[risk.fee_ceilings]
max_priority_fee_lamports = 10000
max_relay_tip_lamports = 5000
max_total_tx_cost_lamports = 20000
max_daily_loss_lamports = 500000
max_consecutive_losses = 3
max_net_loss_per_trade_lamports = 50000
max_loss_rate_per_100_trades_pct = 60.0

[risk.health]
max_rpc_slot_lag = 5
max_packet_loss_pct = 1.0
max_queue_delay_ms = 50
max_blockhash_age_ms = 500
max_reconciliation_backlog = 100
max_shred_loss_pct = 2.0

[risk.switches]
global_kill = false
buy_only = false
sell_only = false
per_protocol_disabled = []
per_provider_disabled = []
per_token_denylist = []

# ── 10. Strategy (Multi-Factor Signal Engine) ──────────────────────────────────
[strategy]
strategy_type = "momentum-multi-factor"
max_open_positions = 5
position_size_sol = 0.05
take_profit_basis_points = 50
stop_loss_basis_points = 30
max_hold_ms = 30000
min_slot_distance = 1

# Signal engine: 200ms eval interval, 30s stale threshold
eval_interval_micros = 200000
stale_mint_threshold_micros = 30000000
max_tracked_mints = 100
eviction_stale_micros = 30000000

# Gate configuration
min_composite_score = 0.25
min_confidence = 0.40
max_spread_bps = 50.0
max_age_micros = 10000000
min_event_rate = 1.0
enable_event_rate_gate = true
enable_ev_gate = false

# Factor weights (normalized to 1.0)
momentum_weight = 0.30
volume_profile_weight = 0.15
spread_weight = 0.20
slot_freshness_weight = 0.10
protocol_confidence_weight = 0.10
momentum_divergence_weight = 0.15

# ── 11. Observability ──────────────────────────────────────────────────────────
[observability]
metrics_endpoint = "0.0.0.0:9090"
metrics_prefix = "solbot"
log_level = "info"
log_format = "json"
log_sampling_rate = 0.1
trace_storage_path = "/var/log/solbot/traces"

# ── 12. Storage ────────────────────────────────────────────────────────────────
[storage]
state_path = "/var/lib/solbot/state"
dedup_cache_size = 262144
reconciliation_db = "/var/lib/solbot/reconciliation.db"
max_disk_usage_gb = 5.0

# ── 13. Runtime ────────────────────────────────────────────────────────────────
[runtime]
graceful_shutdown_timeout_secs = 30
restart_max_retries = 3
restart_delay_ms = 1000
cpu_affinity_enabled = true
memory_limit_mb = 4096
file_descriptor_limit = 1048576

# ── 14. Canary (disabled — production binary) ──────────────────────────────────
[canary]
enabled = false
max_wallet_balance_sol = 0.5
max_sol_per_trade = 0.01
max_daily_trades = 20
max_open_positions = 1
manual_approval = false
approval_timeout_secs = 60
shadow_comparison = false
shadow_db_path = "/var/lib/solbot/shadow.db"
allowed_protocols = []
max_slippage_basis_points = 25
min_wallet_balance_sol = 0.05