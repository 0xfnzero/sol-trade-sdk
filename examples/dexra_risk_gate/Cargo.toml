[package]
name = "dexra_risk_gate"
version = "0.1.0"
edition = "2021"

[dependencies]
sol-trade-sdk = { path = "../.." }
solana-sdk = { workspace = true }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
arc-swap = "1.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
